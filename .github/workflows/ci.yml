name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Swift tests
        run: swift test
      - name: Swift release build
        run: swift build -c release
      - name: Bridge tests without a Blink account
        run: |
          python3 -m pip install -r Sources/Blinky/Bridge/requirements.txt
          python3 -m unittest discover -s Tests/Python -p 'test_*.py'
